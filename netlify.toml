# ThinkArena — Netlify configuration
#
# Site-wide auth is enforced by the Edge Function in
# `netlify/edge-functions/basic-auth.ts` (HTTP Basic Auth).
#
# Set these environment variables in Netlify (Site configuration → Environment
# variables), then redeploy:
#
#   BASIC_AUTH_USER   username for the login prompt
#   BASIC_AUTH_PASS   password for the login prompt
#
# Without them the site returns 503 rather than serving unprotected content.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback so client-side routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
