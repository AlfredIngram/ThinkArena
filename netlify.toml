# ThinkArena — Netlify configuration
#
# Auth is handled by Supabase Auth (per-user accounts) inside the app.
# The old site-wide HTTP Basic Auth gate has been DISABLED: its edge function
# now lives in `netlify/edge-functions.disabled/` (outside the auto-deployed
# `netlify/edge-functions/` directory), so Netlify no longer runs it and users
# are no longer prompted by the browser.
#
# To re-enable it: move `basic-auth.ts` back into `netlify/edge-functions/`,
# set the env vars below, and redeploy.
#
#   BASIC_AUTH_USER   username for the login prompt
#   BASIC_AUTH_PASS   password for the login prompt
#
# Supabase (per-user accounts) — set these to enable the login screen:
#
#   VITE_SUPABASE_URL        e.g. https://<project-ref>.supabase.co
#   VITE_SUPABASE_ANON_KEY   the publishable/anon key (public by design)
#
# Vite bakes VITE_* values at build time, so changing them requires a redeploy.
# If they are absent the app falls back to local-only (localStorage) mode.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback so client-side routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
